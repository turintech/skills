/* As artemis-ui's Versions table: a sticky Version column with the Best badge, right-aligned numbers in the page's own face with

   is cut with its full text on hover. The card's .plot scrolls the table sideways. */

table.sum td.what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

table.sum .vword { margin-left: 4px; }

/* The chart rail (as in the platform's Graphs tab): one view at a time beside it, the open one marked aria-current. Narrower than

/* A view switch: the open view fades out (--t-hover), the next eases in (--t-highlight), both on the spec's --ease-enter; the stage

.view.entering { animation: view-in var(--t-highlight) var(--ease-enter) both; }

      <button type="button" class="btn" title="Opens the print dialog: choose Save as PDF" onClick=${function () { var was = theme; if (was !== "light") setTheme("light"); setTimeout(function () { try { window.print(); } catch (e) { toast("This browser blocked printing here; open the page on its own and try again"); } if (was !== "light") setTheme(was); }, 350); }}>Download PDF</button>
      <button type="button" class="btn" title="Clears the metrics, views and versions you picked here" onClick=${function () { forget(dataset + ":"); setResetKey(function (x) { return x + 1; }); toast("Picks reset"); }}>Reset</button>
    </div>
    </header>
    <div class=${"studio" + (showAll ? " all" : "")}>
      <div class="stage" ref=${stageRef}>
        ${views.map(function (x) { var on = showAll || x[0] === active, cls = "view" + (on ? "" : " view-off") + (swap.leaving === x[0] ? " leaving" : "") + (swap.entering === x[0] ? " entering" : "");
          return html`<section key=${x[0]} id=${"view-" + x[0]} data-view=${x[0]} class=${cls} aria-label=${x[2]}>${x[0] === "sessions"
            ? h(Guard, { key: dataset + "sessions" + resetKey, chart: true }, html`<${SessionsCard} ds=${ds} sel=${si} T=${T} W=${cardW} scope=${dataset + ":sessions"} toast=${toast}/>`) : render(x)}${x[0] === "best" ? summary : null}</section>`; })}
      </div>
      <nav class=${"rail" + (railMini ? " mini" : "")} aria-label="Charts">
        <button type="button" class="rail-toggle" aria-expanded=${railMini ? "false" : "true"} aria-label=${railMini ? "Show chart names" : "Hide chart names"} title=${railMini ? "Show chart names" : "Hide chart names"}
          onClick=${function () { setRailMini(!railMini); store("railCollapsed", !railMini); }}>${RAIL_TOGGLE_ICON}</button>
        ${views.map(function (x) { var on = x[0] === active;
        return html`<button key=${x[0]} type="button" class="rail-item" data-view=${x[0]} aria-controls=${"view-" + x[0]} aria-current=${on ? "true" : null} aria-label=${x[2]} title=${x[2]} onClick=${function () { openView(x[0], active); }}>${railIcon(x[0])}<span class="rail-lab">${x[2]}</span></button>`; })}</nav>
    </div>
    ${pageNotes}
    ${foot}
    ${toastMsg ? html`<div class="toast" role="status">${toastMsg}</div>` : null}
  </div>`;
}

/* ---------- label layout: one pass over every chart after each render ----------
   Ticks that would overprint give way (0 and the ends first). Every other label is pulled inside its plot (or the chart),
   cut with an ellipsis if it is wider than that, then nudged up or down past any label already placed, and hidden only

    texts.forEach(function (x) { x.style.transform = ""; x.style.visibility = ""; x.style.display = ""; restore(x, leaf(x)); });

    var shift = function (r, dx, dy) { return { left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy }; };
    var clipOf = function (el) {

        if (r) { var x0 = box.left + +r.getAttribute("x"), y0 = box.top + +r.getAttribute("y"); return { left: x0, top: y0, right: x0 + +r.getAttribute("width"), bottom: y0 + +r.getAttribute("height") }; }

    //    and a tick that would overprint one already kept is hidden

      var own = [];  // ticks on this axis keep 2px apart; against another axis's ticks only a real overlap counts, so the corner keeps both end ticks
      var ticks = [].filter.call(g.querySelectorAll(".recharts-cartesian-axis-tick-label"), function (x) { return x.textContent.trim(); });

        var r = R(o.x), dx = r.left < box.left + 1 ? box.left + 1 - r.left : r.right > box.right - 1 ? box.right - 1 - r.right : 0;  // cut by the chart's edge: moved inside

var declutterT = 0;
function scheduleDeclutter() { clearTimeout(declutterT); declutterT = setTimeout(declutter, 30); }
if (window.MutationObserver) new MutationObserver(scheduleDeclutter).observe(document.getElementById("root"), { childList: true, subtree: true });
window.addEventListener("resize", scheduleDeclutter);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleDeclutter);

/* A drawing error shows its reason instead of an empty page; React reports render errors here, not to a try/catch. */
function Guard(props) { React.Component.call(this, props); this.state = { error: null }; }
Guard.prototype = Object.create(React.Component.prototype);
Guard.prototype.constructor = Guard;
Guard.getDerivedStateFromError = function (error) { return { error: error }; };
Guard.prototype.componentDidCatch = function (error) { if (window.__AR_ERRORS) window.__AR_ERRORS.push("SCRIPT ERROR: " + error.message); };
Guard.prototype.render = function () {
  var e = this.state.error;
  if (!e) return this.props.children;
  return this.props.chart ? h("div", { className: "card" }, h("div", { className: "err" }, "This chart failed to draw: " + e.message)) : h("div", { className: "err" }, "The studio failed to draw this snapshot: " + e.message);
};
try { ReactDOM.createRoot(document.getElementById("root")).render(h(Guard, null, h(App))); }
catch (e) { document.getElementById("root").innerHTML = '<div class="err">The studio failed to start: ' + esc(e.message) + "</div>"; }
})();

</script>
