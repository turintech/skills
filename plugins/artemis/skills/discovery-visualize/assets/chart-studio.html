/* ---------- shared bits ---------- */
function Tip(props) {
  if (!props.active || !props.payload || !props.payload.length) return null;
  var p = props.payload[0].payload; if (!p || !p.tip) return null;
  return html`<div class="tip">${p.tip.map(function (l, i) { return html`<div key=${i} class=${l[0] === "~" ? "t2" : ""}>${i === 0 ? html`<b>${l}</b>` : l[0] === "~" ? l.slice(1) : l}</div>`; })}</div>`;
}
function versionTip(v, key, m) {
  var st = mstat(v, key), vb = vsb(v, key), out = [v.label + (v.experimentTitle ? ": " + v.experimentTitle : "")];
  if (v._failed) out.push("✕ Failed your correctness check");
  if (st && st.mean != null) out.push("Mean " + fmtNum(st.mean) + unitOf(m) + (st.count ? " over " + runsWord(st.count) : ""));  // no count: no "0 iterations"
  if (vb) out.push(chg(m, vb.improvementPct) + " vs the original, " + vWord(vb.verdict) + (vb.ciLowPct != null ? " (95% " + ivl(m, vb.ciLowPct, vb.ciHighPct) + ")" : ""));
  if (v.experimentStatus) out.push("~Experiment " + v.experimentStatus + (v.experimentConclusion ? ": " + clip(v.experimentConclusion, 160) : ""));
  return out;
}
function clip(t, n) { t = String(t || ""); return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, "") + "..." : t; }
function Legend(props) {
  return html`<div class="legend" role="group" aria-label="Series">${props.series.map(function (s) {
    var on = !props.hidden[s.key];
    return html`<button key=${s.key} type="button" aria-pressed=${on ? "true" : "false"} onClick=${function () { props.toggle(s.key); }} title=${on ? "Hide " + s.label : "Show " + s.label}>
      <span class=${"sw " + (s.shape || "")} style=${{ background: s.color, color: s.color }}></span>${s.label}</button>`;
  })}</div>`;
}
function Popover(props) {
  var ref = useRef(null);
  useEffect(function () {
    var f = function (e) { if (ref.current && !ref.current.contains(e.target) && !(e.target.closest && e.target.closest("[data-pop='" + props.id + "']"))) props.onClose(); };
    var k = function (e) { if (e.key === "Escape") props.onClose(); };
    document.addEventListener("mousedown", f); document.addEventListener("keydown", k);
    return function () { document.removeEventListener("mousedown", f); document.removeEventListener("keydown", k); };
  }, []);
  React.useLayoutEffect(function () {  // anchored to the tools row's right edge; on a phone that row can sit left, so shift back on screen
    var el = ref.current; if (!el) return;
    var r = el.getBoundingClientRect(), vw = document.documentElement.clientWidth, shift = r.left < 16 ? 16 - r.left : r.right > vw - 16 ? vw - 16 - r.right : 0;
    if (shift) el.style.right = (-shift) + "px";
  }, []);
  return html`<div class="pop" ref=${ref} role="dialog" aria-label=${props.label}>${props.children}</div>`;
}
function Ctl(props) {  // a <label> only around a menu; around buttons, a click on the caption would press the first one
  return props.group ? html`<div class="ctl"><span>${props.label}</span>${props.children}</div>` : html`<label class="ctl"><span>${props.label}</span>${props.children}</label>`;
}
function Means(props) {  // every Conclusion looks the same: one green-bordered box of short bullets
  if (!props.text) return null;
  return html`<div class="means"><h3>${props.title || "Conclusion"}</h3>${Array.isArray(props.text) ? html`<ul class="cl">${props.text.filter(Boolean).map(function (t, k) { return html`<li key=${k}>${t}</li>`; })}</ul>` : html`<p>${props.text}</p>`}</div>`;
}

/* The card shell: question heading, labelled tools on the heading row, how to read it, legend, chart,
   the "Conclusion" box, and a small Artemis mark in the corner. */
function Card(props) {
  var c = props.card, set = props.set, ref = useRef(null);
  var st = useState(null), open = st[0], setOpen = st[1];
  var title = props.question, toast = props.toast;
  var sp = props.scope.split(":"), fileBase = (sp[0] + (/^s\d+$/.test(sp[2] || "") ? "-" + sp[2] : "") + "-" + props.id).replace(/[^a-z0-9-]+/gi, "-");
  function dl(kind) {
    if (kind === "csv") { var rows = (props.rows ? props.rows() : []).map(function (r) {  // every CSV says which rows failed the user's check
        if (r.failed_correctness_check != null || !/^v\d+$/.test(String(r.version || ""))) return r;
        return Object.assign({}, r, { failed_correctness_check: FAILED_NOW.indexOf(+String(r.version).slice(1)) >= 0 });
      }); if (!rows.length) { toast("Nothing plotted to export"); return; } saveFile(fileBase + ".csv", csvOf(rows), toast).catch(function (e) { toast("CSV export failed (" + ((e && e.message) || "this browser") + ")"); }); return; }
    var svg = buildSVG(ref.current, title, props.series || [], c.hidden || {});
    if (!svg) { toast("No chart to export"); return; }
    var said = function (m) { toast(withFonts.embedded ? m : m + " (the fonts did not load, so it uses a system font)"); };  // an image without its web font
    if (kind === "svg") { withFonts(svg).then(function (t) { return saveFile(fileBase + ".svg", t, said); }).catch(function (e) { toast("SVG export failed (" + ((e && e.message) || "this browser") + ")"); }); return; }
    withFonts(svg).then(svgToPng).then(function (b) { return saveFile(fileBase + ".png", b, said); }).catch(function (e) { toast("PNG export failed (" + ((e && e.message) || "this browser") + "); try SVG"); });
  }
  var toggle = function (k) { var hd = Object.assign({}, c.hidden || {}); hd[k] = !hd[k]; set({ hidden: hd }); };
  var vlist = props.versionChoices || [], mlist = props.metricChoices || null, img = props.images !== false;
  var none = vlist.length > 0 && vlist.every(function (l) { return (c.offV || []).indexOf(l) >= 0; }), NONE = "No versions shown. Pick some under Versions.";
  // Picks are saved per card, so a returning reader is told what this card leaves out, and where to bring it back.
  var hidM = (c.offM || []).map(function (k) { return (mlist || []).filter(function (m) { return m.key === k; })[0]; }).filter(Boolean).map(mlabel);
  var hidV = (c.offV || []).filter(function (l) { return vlist.indexOf(l) >= 0; });
  var hiddenSay = [hidM.length ? hidM.join(", ") + " (Metrics)" : null, hidV.length ? hidV.join(", ") + " (Versions)" : null].filter(Boolean).join("; ");
  var pop = function (k, label, body) { return open === k ? html`<${Popover} id=${props.id + "-" + k} label=${label} onClose=${function () { setOpen(null); }}>${body}<//>` : null; };
  var opener = function (k, label) { return html`<button type="button" class="btn" data-pop=${props.id + "-" + k} aria-expanded=${open === k} onClick=${function () { setOpen(open === k ? null : k); }}>${label}</button>`; };
  return html`<section class="card" ref=${ref} data-card=${props.id}>
    <div class="head">
      <img class="mark" src=${ICON} alt="" aria-hidden="true"/>
      <h2>${title}</h2>
      <div class="tools">
        ${props.tag ? html`<span class="tag">${props.tag}</span>` : null}
        ${props.controls || null}
        ${mlist ? opener("m", "Metrics") : null}
        ${vlist.length ? opener("v", "Versions") : null}
        ${opener("d", "Download")}
        ${pop("v", "Versions", html`<h3>Versions</h3>
          <div class="checks">${vlist.map(function (l) { var off = (c.offV || []).indexOf(l) >= 0; return html`<label key=${l}><input type="checkbox" checked=${!off} onChange=${function () { var o = (c.offV || []).filter(function (x) { return x !== l; }); if (!off) o.push(l); set({ offV: o }); }}/><span>${l}</span></label>`; })}</div>
          <div class="row"><button type="button" class="link" onClick=${function () { set({ offV: [] }); }}>All</button><button type="button" class="link" onClick=${function () { set({ offV: vlist.slice() }); }}>None</button></div>`)}
        ${pop("m", "Metrics", html`<h3>Metrics</h3>
          <div class="checks" style=${{ gridTemplateColumns: "1fr" }}>${(mlist || []).map(function (m) { var off = (c.offM || []).indexOf(m.key) >= 0; return html`<label key=${m.key}><input type="checkbox" checked=${!off} onChange=${function () { var o = (c.offM || []).filter(function (x) { return x !== m.key; }); if (!off) o.push(m.key); set({ offM: o }); }}/><span title=${m.key}>${mlabel(m)}</span></label>`; })}</div>
          <div class="row"><button type="button" class="link" onClick=${function () { set({ offM: [] }); }}>All</button></div>`)}
        ${pop("d", "Download", html`<h3>Download</h3>
          ${img ? html`<button type="button" class="btn" data-dl="png" onClick=${function () { setOpen(null); dl("png"); }}>PNG, 2x</button>
          <button type="button" class="btn" data-dl="svg" onClick=${function () { setOpen(null); dl("svg"); }}>SVG</button>` : null}
          <button type="button" class="btn" data-dl="csv" onClick=${function () { setOpen(null); dl("csv"); }}>CSV of the ${img ? "plotted " : ""}data</button>`)}
      </div>
    </div>
    ${props.series && props.series.length > 1 ? html`<${Legend} series=${props.series} hidden=${c.hidden || {}} toggle=${toggle}/>` : null}
    <div class="plot">${none ? html`<div class="sparse">${NONE}</div>` : props.children}</div>
    ${none ? null : props.after || null}
    ${none || !hiddenSay ? null : html`<p class="missing">Hidden here: ${hiddenSay}</p>`}
    ${FAILED_NOW.length && ["ranked", "sessions"].indexOf(props.id) < 0 ? html`<p class="missing">✕ Failed your correctness check: ${FAILED_NOW.map(function (n) { return "v" + n; }).join(", ")}. Measured, but not usable.</p>` : null}

    var pick = (ds.multi ? [["sessions", null]] : []).concat(main, more).filter(function (x) { return x[0] === ONLY; })[0];
    var onlyCard = !pick ? html`<div class="err">This ${ds.multi ? "project" : "run"} has no ${ONLY} chart to draw.</div>`
      : ONLY === "sessions" ? h(Guard, { key: dataset + "sessions", chart: true }, html`<${SessionsCard} ds=${ds} sel=${si} T=${T} W=${cardW} scope=${dataset + ":sessions"} toast=${toast}/>`) : render(pick);
    // A one-card page has no headline, so it says how Best was chosen in one line that names the version, as the studio does.
    var ofProject = !ds.multi ? null : ONLY === "sessions" ? html`<p class="lede">The Best line below is Discovery session 1's; the chart ranks all ${ds.sessions.length} sessions.</p>`

    var why = !D.best && checks.length ? html`<p class="lede">${checks.join(" ")}</p>` : D.best ? html`<p class="lede">${[bestRule.replace(/\.$/, ": " + D.best.label + "."), rawShown ? w.raw.label + " does best on " + mlabel(pm) + " alone (" + chg(pm, w.raw.pctBetter) + ")." : null, alsoBest ? alsoBest + "." : null, gate].concat(noReading(D.best), checks).filter(Boolean).join(" ")}</p>` : null;
    var themeBar = html`<div class="bar"><${Seg} label="Theme" value=${theme} onChange=${setTheme} options=${[["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]]}/></div>`;
    return html`<div class="page" ref=${wrap}>${themeBar}${onlyCard}${ofProject}${why}${leftOut}${nonFinite}${foot}${toastMsg ? html`<div class="toast" role="status">${toastMsg}</div>` : null}</div>`;
  }
  return html`<div class="page" ref=${wrap}>
    <header>
      <div class="brand"><img src=${ICON} alt="Artemis"/><div class="eyebrow"><span>${ds.multi ? ds.label + ", Discovery session " + (si + 1) : s.run.projectName || "Discovery run " + shortSha(s.run.id)}</span><span>·</span><span>${pm ? mlabel(pm) : ""}</span><span>·</span><span>${s.run.status || "no status"}, ${s.run.versionCount != null ? s.run.versionCount : D.versions.length} versions</span></div></div>
      <h1>${title}</h1>
      ${leftOut}${nonFinite}${clamped}
      <${Means} text=${topMeans && topMeans.text}/>
    </header>
    <div class="bar">
      <${Ctl} label="Project"><select value=${dataset} onChange=${function (e) { setDataset(e.target.value); }}>${DATASETS.filter(function (d) { return SNAPS[d.id]; }).map(function (d) { return html`<option key=${d.id} value=${d.id}>${d.label}</option>`; })}</select><//>
      ${ds.multi ? (ds.sessions.length > 4 ? html`<${Ctl} label="Discovery session"><select value=${si} onChange=${function (e) { setSess(Number(e.target.value)); }}>${ds.sessions.map(function (x, i) { return html`<option key=${i} value=${i}>${"Discovery session " + (i + 1)}</option>`; })}</select><//>` : html`<${Seg} label="Discovery session" value=${si} onChange=${setSess} options=${ds.sessions.map(function (x, i) { return [i, String(i + 1), false, "Discovery session " + (i + 1)]; })}/>`) : null}
      <${Seg} label="Theme" value=${theme} onChange=${setTheme} options=${[["auto", "Auto"], ["light", "Light"], ["dark", "Dark"]]}/>
      <span style=${{ flex: 1 }}></span>
      <button type="button" class="btn" title="Clears the metrics, views and versions you picked here" onClick=${function () { forget(dataset + ":"); setResetKey(function (x) { return x + 1; }); toast("Picks reset"); }}>Reset</button>
    </div>
    ${ds.multi ? h(Guard, { key: dataset + "sessions" + resetKey, chart: true }, html`<${SessionsCard} ds=${ds} sel=${si} T=${T} W=${cardW} scope=${dataset + ":sessions"} toast=${toast}/>`) : null}
    ${main.map(render)}
    ${more.length ? html`<details class="more" open=${moreOpen} onToggle=${function (e) { setMore(e.target.open); store("more", e.target.open); }}>
      <summary>More charts (${more.length}): ${more.map(function (x) { return { time: "over time", box: "box plots", pareto: "trade-off", ai: "AI Metrics" }[x[0]]; }).join(", ")}</summary>
      <div class="stack">${moreOpen ? more.map(render) : null}</div>
    </details>` : null}
    ${foot}
    ${toastMsg ? html`<div class="toast" role="status">${toastMsg}</div>` : null}
  </div>`;
}

/* ---------- label layout: one pass over every chart after each render ----------

/* A drawing error shows its reason instead of an empty page; React reports render errors here, not to a try/catch. */
function Guard(props) { React.Component.call(this, props); this.state = { error: null }; }
Guard.prototype = Object.create(React.Component.prototype);
Guard.prototype.constructor = Guard;
Guard.getDerivedStateFromError = function (error) { return { error: error }; };

  var e = this.state.error;
  if (!e) return this.props.children;
  return this.props.chart ? h("div", { className: "card" }, h("div", { className: "err" }, "This chart failed to draw: " + e.message)) : h("div", { className: "err" }, "The studio failed to draw this snapshot: " + e.message);
};
