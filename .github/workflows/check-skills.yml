name: Check skills

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The exact CLI release the skills are checked against. Raise it by hand after testing a newer release;
      # check_cli_pin.py fails it if it falls outside the skills' artemis-cli-min / artemis-cli-max range.
      ARTEMIS_CLI_PINNED: "1.1.18"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PyYAML for the front-matter check
        run: python3 -m pip install pyyaml==6.0.2
      - name: Download the pinned Artemis CLI
        env:
          # Repository secret ARTEMIS_FILES_AUTH ("user:password"), only if the file server needs auth again.
          FILES_AUTH: ${{ secrets.ARTEMIS_FILES_AUTH }}
        run: |
          python3 scripts/check_cli_pin.py "$ARTEMIS_CLI_PINNED"
          base="https://files.artemis.turintech.ai/public/artemis-cli/$ARTEMIS_CLI_PINNED"
          auth=()
          if [ -n "$FILES_AUTH" ]; then auth=(--anyauth -u "$FILES_AUTH"); fi
          mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          curl -fsSL "${auth[@]}" -O "$base/artemis-cli-linux-amd64" -O "$base/checksums.txt"
          grep " artemis-cli-linux-amd64\$" checksums.txt | sha256sum -c -
          chmod +x artemis-cli-linux-amd64
          echo "ARTEMIS_CLI=$RUNNER_TEMP/cli/artemis-cli-linux-amd64" >> "$GITHUB_ENV"
      - name: Check skill metadata, references and CLI commands
        env:
          # A skill that needs a newer CLI than the pin fails here rather than being skipped.
          ARTEMIS_CLI_STRICT: "1"
        run: scripts/check-skills.sh
      - name: Check each skill against the CLI it declares as its minimum
        env:
          FILES_AUTH: ${{ secrets.ARTEMIS_FILES_AUTH }}
        run: |
          base=https://files.artemis.turintech.ai/public/artemis-cli
          auth=()
          if [ -n "$FILES_AUTH" ]; then auth=(--anyauth -u "$FILES_AUTH"); fi
          for ver in $(sed -nE 's/^  artemis-cli-min: "([0-9.]+)"$/\1/p' plugins/artemis/skills/*/SKILL.md | sort -uV); do
            curl -fsSL "${auth[@]}" "$base/$ver/artemis-cli-linux-amd64" -o "$RUNNER_TEMP/artemis-$ver"
            chmod +x "$RUNNER_TEMP/artemis-$ver"
            python3 scripts/check_cli.py "$RUNNER_TEMP/artemis-$ver"
          done
      - name: Test the discovery-visualize collector, report kit and checker
        run: python3 -m unittest discover -s plugins/artemis/skills/discovery-visualize/tests -p "test_*.py" -v
      - name: Test the skill checks
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Report where skills could be shorter
        run: python3 scripts/skill_length_report.py
